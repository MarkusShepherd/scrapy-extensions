name: Draft a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number (e.g. 1.2.3) OR one of: patch|minor|major|prepatch|preminor|premajor|prerelease'
        required: true
        default: 'patch'

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-poetry-env
      - name: Update version
        id: updated_version
        shell: bash
        run: |
          poetry version "${{ github.event.inputs.version }}"
          echo "version=$(poetry version --short)" >> "$GITHUB_OUTPUT"
      - name: Update changelog
        shell: bash
        run: |
          poetry run kacl-cli release "${{ steps.updated_version.outputs.version }}" --modify --auto-link
          echo "" >> CHANGELOG.md
          poetry run kacl-cli get "${{ steps.updated_version.outputs.version }}" > release-notes.md
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'CHANGELOG.md pyproject.toml'
          message: 'Release ${{ steps.updated_version.outputs.version }}'
      - name: Create tag
        run: |
          git tag "${{ steps.updated_version.outputs.version }}"
          git push origin "${{ steps.updated_version.outputs.version }}"
      - name: Create a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.updated_version.outputs.version }}" \
            --draft \
            --title "Release ${{ steps.updated_version.outputs.version }}" \
            --notes-file release-notes.md
